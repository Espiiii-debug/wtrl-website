<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <title>Waterlaw Team</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link href="styles/main-style.css" rel="stylesheet">
</head>
<body>

  <div class="background-image">
    <div class="ambient-light"></div>
    <div class="navbar">
      <a class="contact-button" href="#contact">Contact</a>
    </div>
    <div class="hero-content">
      <h1 class="glow-text">Waterlaw</h1>
      <hr>
      <p>Lancez votre projet avec nous 🚀</p>
    </div>
  </div>

  <div class="contact-section" id="contact">
    <h2>Contactez-nous</h2>
    <div class="contact-form">
      <label><input type="text" placeholder="Nom" required maxlength="26"></label>
      <label><input type="text" placeholder="Entreprise" required maxlength="26"></label>
      <label><input type="email" placeholder="Email" required maxlength="254"></label>
      <label><textarea placeholder="Présentez votre projet" required rows="6"></textarea></label>
      <button type="submit">Envoyer</button>
    </div>
  </div>

  <footer>
    © 2025 Waterlaw — Tous droits réservés.
  </footer>

</body>
</html>
