<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <title>Waterlaw Team</title>
  <link href="https://www.w3schools.com/w3css/4/w3.css" rel="stylesheet">
  <link href="styles/main-style.css" rel="stylesheet">
</head>

<body>
<div class="background-image w3-display-container w3-animate-opacity w3-text-white">
  <div class="navbar">
    <a class="contact-button" href="#contact">Contact</a>
  </div>
  <div class="w3-display-topleft w3-padding-large w3-xlarge">
  </div>
  <div class="w3-display-middle">
    <h1 class="w3-jumbo w3-animate-top">Waterlaw</h1>
    <hr class="w3-border-grey" style="margin:a uto;width:40%">
    <p class="w3-large w3-center">Lancez votre projet avec nous 🚀</p>
  </div>
</div>

<div class="contact-section" id="contact">
  <div class="w3-container">
    <h2>Contactez-nous</h2>
    <div class="contact-form">
      <label>
        <input placeholder="Nom" required type="text" maxlength=26>
      </label>
      <label>
        <input placeholder="Entreprise" required type="text" maxlength=26>
      </label>
      <label>
        <input placeholder="Email" required type="email" maxlength=254>
      </label>
      <label>
        <textarea placeholder="Présentez votre projet" required rows="7"></textarea>
      </label>
      <button type="submit">Envoyer</button>
    </div>
  </div>
</div>
</body>
</html>
